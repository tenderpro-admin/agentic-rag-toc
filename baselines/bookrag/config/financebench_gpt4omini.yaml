# BookRAG (gbc) config for FinanceBench on gpt-4o-mini.
# Adapted from config/gbc.yaml for a CPU/laptop + OpenAI-cloud setup:
#   - LLM + VLM + embeddings -> OpenAI cloud (no local GPU servers)
#   - reranker -> small Qwen3-Reranker-0.6B on CPU
#   - MinerU -> local "pipeline" backend (no sglang server)
# API key is read from the OPENAI_API_KEY env var (provider patch); never stored here.

pdf_path: TODO   # set per-document by main.py from the dataset
save_path: TODO  # set per-document by main.py (working_dir/doc_uuid)

llm:
  model_name: gpt-4o-mini
  api_key: env            # resolved from OPENAI_API_KEY by provider patch
  api_base: https://api.openai.com/v1
  backend: openai
  max_tokens: 5000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 4

vlm:
  model_name: gpt-4o-mini
  api_key: env
  api_base: https://api.openai.com/v1
  temperature: 0.1
  max_tokens: 4000
  backend: gpt

index:
  chunk_size: 512
  overlap: 50

mineru:
  backend: pipeline       # local CPU/GPU parsing, no sglang server
  method: auto
  server_url: http://localhost:30000
  # lang=ch: MinerU 2.1.11 ships v4-era OCR arch/dicts; lang=en wants a missing
  # v4 en rec, and v5 recs (latin) mismatch the v4 arch (ctc head 838 vs 504).
  # "ch" uses ch_PP-OCRv5_det + ch_PP-OCRv4_rec_server_doc (present, v4-consistent;
  # the doc rec handles English text + digits, fine for 10-K financials).
  lang: ch

tree:
  node_keywords: True
  node_summary: True
  use_vlm: False          # skip VLM in tree to save cost/time for smoke

graph:
  extractor_type: "llm"
  local_model_name: "en_core_web_sm"
  image_description_force: False   # skip per-image VLM calls for smoke
  max_gleaning: 0
  refine_type: "advanced"
  embedding_config:
    model_name: text-embedding-3-small
    backend: openai
    max_length: 8192
    device: "cpu"
    api_base: https://api.openai.com/v1
  reranker_config:
    model_name: Qwen/Qwen3-Reranker-0.6B
    max_length: 4096
    device: "mps"          # Apple GPU; CPU reranking is the retrieval bottleneck
    backend: local

vdb:
  mm_embedding: False
  vdb_dir_name: "Tree_vdb"
  collection_name: "TreeVDB"
  force_rebuild: True
  embedding_config:
    model_name: text-embedding-3-small
    backend: openai
    max_length: 8192
    device: "cpu"
    api_base: https://api.openai.com/v1

index_type: "gbc"
rag_force_reprocess: True

rag:
  strategy: gbc
  variant: standard
  topk: 10
  sim_threshold_e: 0.3
  select_depth: 2
  max_retry: 2
  reranker_config:
    model_name: Qwen/Qwen3-Reranker-0.6B
    max_length: 4096
    device: "mps"          # Apple GPU; CPU reranking is the retrieval bottleneck
    backend: local
  mm_reranker_config:
    type: "text"
    model_name: text-embedding-3-small
    backend: openai
    api_base: https://api.openai.com/v1
    device: "cpu"
