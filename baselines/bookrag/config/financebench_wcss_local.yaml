# BookRAG OFFICIAL local-model fleet (config/gbc.yaml) adapted for WCSS Lem GPU:
# ONE node, FOUR H100 (96 GB each). No OpenAI — every model runs on the cluster,
# exactly like the upstream paper setup. Ports are localhost; the SLURM job
# (wcss/serve_fleet.sh) launches the servers and pins each to a GPU.
#
# GPU map (CUDA_VISIBLE_DEVICES for the servers; main.py sees all 4):
#   GPU0  vLLM  LLM   Qwen/Qwen3-8B-AWQ            -> :8003/v1
#   GPU1  vLLM  VLM   Qwen/Qwen2.5-VL-7B-Instruct  -> :8000/v1
#   GPU2  vLLM  embed Qwen/Qwen3-Embedding-0.6B    -> :8007/v1
#         vLLM  rerank Qwen/Qwen3-Reranker-4B      -> :8011 (/rerank)
#   GPU3  sglang MinerU vlm                        -> :30000
#         gme-Qwen2-VL-2B (vdb embed, in-process in main.py) -> cuda:3
#
# Only FinanceBench-specific change vs gbc.yaml: mineru.lang ch (handles English
# 10-K text + digits with MinerU 2.1.11's shipped OCR; see financebench_wcss.yaml).

pdf_path: null   # set per-document by main.py from the dataset
save_path: null  # set per-document by main.py (working_dir/doc_uuid)

llm:
  model_name: Qwen/Qwen3-8B-AWQ
  api_key: EMPTY                       # vLLM ignores; any non-empty string
  api_base: http://localhost:8003/v1
  backend: openai
  max_tokens: 5000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 8

vlm:
  model_name: Qwen/Qwen2.5-VL-7B-Instruct
  api_key: EMPTY
  api_base: http://localhost:8000/v1
  temperature: 0.1
  max_tokens: 6000
  backend: gpt

index:
  chunk_size: 512
  overlap: 50

mineru:
  # GPU pipeline parse (validated on H100, fast) instead of a sglang VLM server —
  # avoids stacking sglang+vllm+mineru in one env. Device via MINERU_DEVICE_MODE.
  backend: pipeline
  method: auto
  server_url: http://localhost:30000
  lang: ch

tree:
  node_keywords: True
  node_summary: True

graph:
  extractor_type: "llm"
  local_model_name: "en_core_web_sm"
  image_description_force: True
  max_gleaning: 0
  refine_type: "advanced"
  embedding_config:
    model_name: Qwen/Qwen3-Embedding-0.6B
    backend: openai
    max_length: 4096
    device: "cuda:2"
    api_base: "http://localhost:8007/v1"
  reranker_config:
    model_name: Qwen/Qwen3-Reranker-0.6B
    max_length: 4096
    device: "cuda:3"
    backend: local

vdb:
  mm_embedding: False
  vdb_dir_name: "Tree_vdb"
  collection_name: "TreeVDB"
  force_rebuild: True
  embedding_config:
    model_name: Qwen/Qwen3-Embedding-0.6B
    backend: openai
    max_length: 4096
    device: "cpu"
    api_base: "http://localhost:8007/v1"

index_type: "gbc"
rag_force_reprocess: True

rag:
  strategy: gbc
  variant: standard
  topk: 10
  sim_threshold_e: 0.3
  select_depth: 2
  max_retry: 2
  reranker_config:
    model_name: Qwen/Qwen3-Reranker-0.6B
    max_length: 4096
    device: "cuda:3"
    backend: local
  mm_reranker_config:
    type: "text"
    model_name: Qwen/Qwen3-Embedding-0.6B
    backend: openai
    api_base: "http://localhost:8007/v1"
    device: "cpu"
